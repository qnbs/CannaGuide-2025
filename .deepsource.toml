version = 1

exclude_patterns = [
    "**/node_modules/**",
    "**/dist/**",
    "**/build/**",
    "**/coverage/**",
    "**/out/**",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/*.egg-info/**",
    "**/target/**",
    "**/.gradle/**",
    "**/.mvn/**",
    "**/vendor/**",
]

test_patterns = [
    "**/*.test.ts",
    "**/*.test.tsx",
    "**/*.test.mjs",
    "**/tests/**",
    "**/*.e2e.ts",
    "**/*.ct.tsx",
]

[[analyzers]]
name = "docker"
enabled = true

[analyzers.meta]
dockerfile_paths = [
    ".clusterfuzzlite/Dockerfile",
    ".devcontainer/Dockerfile",
]

[[analyzers]]
name = "javascript"
enabled = true

[analyzers.meta]
dialect = "typescript"
# The repo is "type": "module". commonjs parsing rejects the ESM entrypoints.
style_guide = "airbnb"
module_system = "es-modules"
cyclomatic_complexity_threshold = "low"

[[analyzers]]
name = "python"
enabled = true

[analyzers.meta]
type_checker = "mypy"
max_line_length = 100
runtime_version = "3.x.x"
cyclomatic_complexity_threshold = "medium"

[[analyzers]]
name = "rust"
enabled = true

[analyzers.meta]
msrv = "stable"
track_test_doc_coverage = false
cyclomatic_complexity_threshold = "high"

[[analyzers]]
name = "shell"
enabled = true

[analyzers.meta]
dialect = "sh"

[[analyzers]]
name = "secrets"
enabled = false
