name: Desktop runtime smoke
description: >-
    Installs and launches the packaged desktop app the way a user would and runs
    scripts/desktop-smoke.mjs against it: native start, the bundled frontend reporting
    over IPC, a painted window (Linux), single instance, the flushed quit and a
    restart that finds the saved state. A build, bundle or signature check alone is
    not a runtime qualification.
inputs:
    target:
        description: Rust target triple of the bundle
        required: true
    bundle-dir:
        description: The bundle directory, target/<target>/release/bundle
        required: true
    evidence-dir:
        description: Where reports, logs and screenshots are written
        required: false
        default: desktop-smoke
runs:
    using: composite
    steps:
        - name: Expected version
          id: version
          shell: bash
          run: echo "version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

        # The .deb goes through apt, so its Depends line is resolved like a user's
        # install; the AppImage runs extracted (APPIMAGE_EXTRACT_AND_RUN), since
        # runners have no FUSE 2. dbus-run-session gives the single-instance plugin
        # its session bus.
        - name: Linux -- .deb and AppImage under Xvfb
          if: runner.os == 'Linux'
          shell: bash
          env:
              BUNDLE: ${{ inputs.bundle-dir }}
              EVIDENCE: ${{ inputs.evidence-dir }}
              TARGET: ${{ inputs.target }}
              VERSION: ${{ steps.version.outputs.version }}
          run: |
              set -euo pipefail
              sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils imagemagick dbus dbus-x11
              deb="$(find "$BUNDLE/deb" -name '*.deb' -print -quit)"
              appimage="$(find "$BUNDLE/appimage" -name '*.AppImage' -print -quit)"
              [[ -n "$deb" && -n "$appimage" ]] || { echo "[FAIL] .deb or AppImage missing in $BUNDLE"; exit 1; }
              sudo apt-get install -y "$(realpath "$deb")"
              chmod +x "$appimage"
              # --require-screenshot: on a Linux runner the painted-window check must run and
              # pass; a window it cannot find fails instead of being NOT_RUN.
              smoke() {
                dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' \
                  node scripts/desktop-smoke.mjs --expect-version "$VERSION" --evidence "$EVIDENCE" \
                  --require-screenshot "$@"
              }
              status=0
              smoke --app /usr/bin/cannaguide-desktop --label "$TARGET-deb" || status=1
              smoke --app "$(realpath "$appimage")" --appimage --label "$TARGET-appimage" || status=1
              exit "$status"

        # An x86_64 build on an arm64 runner needs Rosetta 2. It is installed when missing;
        # if that fails the step fails: an Intel bundle is never qualified without a launch.
        - name: macOS -- the .app
          if: runner.os == 'macOS'
          shell: bash
          env:
              BUNDLE: ${{ inputs.bundle-dir }}
              EVIDENCE: ${{ inputs.evidence-dir }}
              TARGET: ${{ inputs.target }}
              VERSION: ${{ steps.version.outputs.version }}
          run: |
              set -euo pipefail
              app="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' -print -quit)"
              [[ -n "$app" ]] || { echo "[FAIL] no .app in $BUNDLE/macos"; exit 1; }
              binary="$(find "$app/Contents/MacOS" -type f -perm -u+x -print -quit)"
              if [[ "$TARGET" == x86_64-apple-darwin && "$(uname -m)" == arm64 ]] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
                echo "[INFO] Rosetta 2 missing; installing it to launch the $TARGET build"
                sudo softwareupdate --install-rosetta --agree-to-license || true
                arch -x86_64 /usr/bin/true || { echo "[FAIL] Rosetta 2 unavailable: the $TARGET build cannot be launched, so it is not qualified"; exit 1; }
              fi
              node scripts/desktop-smoke.mjs --app "$binary" --expect-version "$VERSION" --evidence "$EVIDENCE" --label "$TARGET-app"

        # Windows app folders cannot be redirected, so the runner's profile is reset
        # before each install; runners are ephemeral (desktop-smoke.mjs requires CI).
        - name: Windows -- NSIS and MSI installs
          if: runner.os == 'Windows'
          shell: pwsh
          env:
              BUNDLE: ${{ inputs.bundle-dir }}
              EVIDENCE: ${{ inputs.evidence-dir }}
              TARGET: ${{ inputs.target }}
              VERSION: ${{ steps.version.outputs.version }}
          run: |
              $ErrorActionPreference = 'Stop'
              function Reset-AppProfile {
                  foreach ($dir in "$env:APPDATA\com.cannaguide.desktop", "$env:LOCALAPPDATA\com.cannaguide.desktop") {
                      if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
                  }
              }
              # The installed program, by its exact name, under the given folders.
              function Find-InstalledApp([string[]] $roots) {
                  foreach ($root in $roots) {
                      if (-not (Test-Path $root)) { continue }
                      $found = Get-ChildItem -Path $root -Recurse -Depth 3 -Filter 'cannaguide-desktop.exe' -ErrorAction SilentlyContinue |
                          Select-Object -First 1
                      if ($found) { return $found }
                  }
              }
              # For the evidence: where Windows says each installer put the app.
              function Write-UninstallEntries([string] $file) {
                  Get-ItemProperty -ErrorAction SilentlyContinue `
                      'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                      'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
                      'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
                      Where-Object { $_.DisplayName -like 'CannaGuide*' } |
                      Select-Object DisplayName, DisplayVersion, InstallLocation, DisplayIcon, UninstallString |
                      Format-List | Out-File -FilePath $file -Encoding utf8
              }
              $nsis = Get-ChildItem "$env:BUNDLE\nsis\*-setup.exe" | Select-Object -First 1
              $msi = Get-ChildItem "$env:BUNDLE\msi\*.msi" | Select-Object -First 1
              if (-not $nsis -or -not $msi) { Write-Output "[FAIL] NSIS or MSI installer missing in $env:BUNDLE"; exit 1 }
              $status = 0

              New-Item -ItemType Directory -Force -Path $env:EVIDENCE | Out-Null
              Reset-AppProfile
              $nsisRun = Start-Process -FilePath $nsis.FullName -ArgumentList '/S' -Wait -PassThru
              if ($nsisRun.ExitCode -ne 0) { Write-Output "[FAIL] NSIS install exited $($nsisRun.ExitCode)"; $status = 1 }
              Write-UninstallEntries "$env:EVIDENCE\uninstall-after-nsis.txt"
              $installed = Find-InstalledApp @($env:LOCALAPPDATA, "$env:LOCALAPPDATA\Programs")
              if (-not $installed) { Write-Output '[FAIL] NSIS install: cannaguide-desktop.exe not found (see uninstall-after-nsis.txt)'; $status = 1 }
              else {
                  node scripts/desktop-smoke.mjs --app $installed.FullName --expect-version $env:VERSION --evidence $env:EVIDENCE --label "$env:TARGET-nsis"
                  if ($LASTEXITCODE -ne 0) { $status = 1 }
              }

              Reset-AppProfile
              $msiLog = Join-Path (Resolve-Path $env:EVIDENCE) 'msi-install.log'
              $install = Start-Process -FilePath msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/l*v', "`"$msiLog`"" -Wait -PassThru
              if ($install.ExitCode -ne 0) { Write-Output "[FAIL] MSI install exited $($install.ExitCode)"; $status = 1 }
              Write-UninstallEntries "$env:EVIDENCE\uninstall-after-msi.txt"
              $installed = Find-InstalledApp @($env:ProgramFiles, ${env:ProgramFiles(x86)}, "$env:LOCALAPPDATA\Programs")
              if (-not $installed) { Write-Output '[FAIL] MSI install: cannaguide-desktop.exe not found (see uninstall-after-msi.txt, msi-install.log)'; $status = 1 }
              else {
                  node scripts/desktop-smoke.mjs --app $installed.FullName --expect-version $env:VERSION --evidence $env:EVIDENCE --label "$env:TARGET-msi"
                  if ($LASTEXITCODE -ne 0) { $status = 1 }
              }
              exit $status
