name: Setup Node and install deps
description: Standardized Node setup with pnpm and deterministic install
inputs:
    node-version:
        description: Node.js version to install
        required: false
        default: '24'
    install-command:
        description: Install command to run after setup
        required: false
        default: 'pnpm install --frozen-lockfile'
runs:
    using: composite
    steps:
        - name: Enable Corepack
          shell: bash
          run: corepack enable

        - name: Setup Node.js
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
              node-version: ${{ inputs.node-version }}
              cache: pnpm

        - name: Validate pnpm lockfile
          shell: bash
          run: node ./scripts/check-pnpm-lockfile.mjs

        - name: Install dependencies
          shell: bash
          run: ${{ inputs.install-command }}
