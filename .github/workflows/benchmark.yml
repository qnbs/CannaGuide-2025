name: Performance Benchmark

# Advisory only -- runs weekly + on-demand. Does NOT block main pushes.
# Dependency hygiene and the performance measurement are separate jobs so a
# depcheck failure cannot hide bundle and Lighthouse evidence.
on:
    workflow_dispatch:
    schedule:
        - cron: '23 3 * * 1'

permissions:
    contents: read

env:
    NODE_VERSION: '24'

jobs:
    hygiene:
        name: Dependency hygiene
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node ${{ env.NODE_VERSION }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: depcheck
              run: pnpm run depcheck

    benchmark:
        name: Benchmark
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Capture benchmark start
              run: echo "BENCHMARK_START=$(date +%s)" >> "$GITHUB_ENV"

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node ${{ env.NODE_VERSION }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              working-directory: apps/web
              env:
                  # Hidden source maps for the bundle analysis below only; deployed
                  # builds never set this (stamp-build-metadata --verify rejects maps).
                  BUILD_SOURCEMAP: hidden
                  # lhci serves dist/ at the server root, so the app must be built for
                  # "/" -- with the Pages base its assets 404 and Lighthouse measures
                  # an empty shell.
                  BUILD_BASE_PATH: /
              run: pnpm run build

            # Same post-build step every deploy runs, so dist size matches what ships.
            - name: Prune bundled ORT wasm (as deploys do)
              run: node scripts/prune-bundled-ort-wasm.mjs

            - name: Bundle budget check
              run: node ./scripts/check-bundle-budget.mjs apps/web/dist/assets

            - name: Source map analysis
              working-directory: apps/web
              run: node ../../scripts/explore-bundle.mjs

            # collect and assert run separately instead of `lhci autorun`: a failed
            # assertion used to look like "no metrics", and autorun would upload the
            # reports to public temporary storage once assertions passed. There is
            # no upload step here; the reports stay in the workflow artifact.
            - name: Lighthouse CI collect
              id: lighthouse
              working-directory: apps/web
              run: |
                  pnpm exec lhci collect \
                    --staticDistDir=./dist \
                    --numberOfRuns=3 \
                    --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage" \
                    2>&1 || {
                    echo "[WARN] Lighthouse CI collect failed -- metrics will show n/a"
                    echo "lighthouse_failed=true" >> "$GITHUB_ENV"
                  }

            # Advisory: findings are listed here and counted in the job summary, but
            # do not fail the baseline run. Making budgets blocking is D10 (GH #591).
            # valid-source-maps is expected: the benchmark builds hidden maps.
            - name: Lighthouse assertions (advisory)
              if: env.lighthouse_failed != 'true'
              working-directory: apps/web
              run: |
                  pnpm exec lhci assert --preset=lighthouse:recommended 2>&1 | tee lighthouse-assert.log || true
                  echo "lighthouse_assert_failures=$(grep -c 'failure for' lighthouse-assert.log || true)" >> "$GITHUB_ENV"

            - name: Collect metrics
              working-directory: apps/web
              run: |
                  END_TIME=$(date +%s)
                  export CI_TIME_SECONDS=$((END_TIME - BENCHMARK_START))
                  node ../../scripts/collect-performance-metrics.mjs | tee benchmark-metrics.json
                  node <<'NODE'
                  const fs = require('node:fs')
                  const metrics = JSON.parse(fs.readFileSync('benchmark-metrics.json', 'utf8'))
                  const summary = [
                    '## Performance Benchmark',
                    '',
                    `- Dist size: ${metrics.distSizeKb.toFixed(1)} kB`,
                    `- Main bundle: ${metrics.mainBundleFile ?? 'n/a'} (${metrics.mainBundleKb.toFixed(1)} kB)`,
                    `- Lighthouse performance: ${metrics.lighthousePerformance ?? 'n/a'}/100`,
                    `- Lighthouse accessibility: ${metrics.lighthouseAccessibility ?? 'n/a'}/100`,
                    `- Lighthouse assertion failures (advisory, recommended preset): ${process.env.lighthouse_assert_failures ?? 'n/a'}`,
                    `- CI time: ${metrics.ciTimeSeconds}s`,
                    '',
                  ].join('\n')
                  fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`)
                  NODE

            - name: Upload benchmark artifacts
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: benchmark-artifacts
                  path: |
                      apps/web/benchmark-reports/source-map-explorer.html
                      apps/web/.lighthouseci/
                      apps/web/benchmark-metrics.json
                      apps/web/lighthouse-assert.log
                  retention-days: 14
                  if-no-files-found: warn
                  # .lighthouseci/ is a dot-directory, which upload-artifact skips by
                  # default; it holds only the Lighthouse reports (lhr-*.json).
                  include-hidden-files: true

            # Lighthouse failures are caught above so the metrics and artifacts are
            # still collected -- but a run without Lighthouse metrics is not a
            # baseline and must not show green (CG-AUD-20261027-N04).
            - name: Fail when Lighthouse produced no metrics
              if: env.lighthouse_failed == 'true'
              run: echo "[FAIL] Lighthouse CI failed -- this run produced no performance baseline." >&2 && false
