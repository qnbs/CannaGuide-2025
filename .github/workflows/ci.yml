name: CI

# workflow-version: 2026-08-04-e2e-blocking (CI Status = build+test+verify+security+e2e)

on:
    push:
        branches: [main]
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - 'graphify-out/**'
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/pull_request_template.md'
    # No paths-ignore here on purpose. "CI Status" is a required check, and
    # GitHub evaluates paths filters against only the first 300 changed files --
    # a large pull request could hide a code change beyond that window, skip this
    # workflow entirely, and still satisfy the required check. The `changes` job
    # below makes that decision from the complete diff instead.
    # Run for every PR target so stacked PRs and editor-neutral branch names
    # receive the same required evidence as PRs opened directly against main.
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_VERSION: '24'
    TURBO_TELEMETRY_DISABLED: 1

jobs:
    # ---------------------------------------------------------------------
    # Build -- deliberately the smallest job on the critical path.
    # E2E only needs dist/, so it hangs off THIS job, not off lint and the unit
    # suite. Previously E2E waited on all 21 steps of a single `quality` job
    # (~8.5 min) to obtain an artifact the build produces in ~3.
    # ---------------------------------------------------------------------
    # Decides docs-only vs code from the *full* changed-file list. GitHub's own
    # paths filters stop at 300 files; git does not.
    changes:
        name: Detect code changes
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.detect.outputs.code }}
            desktop: ${{ steps.detect.outputs.desktop }}
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: Detect code changes
              id: detect
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  if [ -z "$BASE_SHA" ]; then
                    echo "Not a pull request -- treating as a code change."
                    echo "code=true" >> "$GITHUB_OUTPUT"
                    echo "desktop=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
                  echo "Changed files:"
                  printf '%s\n' "$CHANGED"
                  echo "---"

                  DOCS_ONLY='(\.md$|^docs/|^graphify-out/|^\.github/ISSUE_TEMPLATE/|^\.github/pull_request_template\.md$)'

                  # Deliberately not `grep -q`: it exits on the first match, the writer
                  # takes SIGPIPE, and under pipefail the pipeline reports 141. The `else`
                  # branch would then read that as "docs only" and skip the pipeline on a
                  # diff that does contain code -- the exact bypass this job exists to
                  # prevent. Read the matches instead, and decide on their content.
                  set +e
                  NON_DOCS=$(printf '%s\n' "$CHANGED" | grep -vE "$DOCS_ONLY")
                  GREP_STATUS=$?
                  set -e

                  # grep: 0 = at least one non-docs path, 1 = none. Anything else means
                  # grep itself failed, and a failed detector must never resolve to
                  # "docs only".
                  if [ "$GREP_STATUS" -gt 1 ]; then
                    echo "[FAIL] Change detection failed (grep exit $GREP_STATUS)."
                    exit 1
                  fi

                  if [ -n "$NON_DOCS" ]; then
                    echo "code=true" >> "$GITHUB_OUTPUT"
                    echo "Code changed -- running the full pipeline. Non-docs paths:"
                    printf '  %s\n' "$NON_DOCS"
                  else
                    echo "code=false" >> "$GITHUB_OUTPUT"
                    echo "Docs-only change -- the code pipeline has nothing to verify."
                  fi

                  # Rust is otherwise compiled only by desktop-build.yml, which fires on
                  # `v*` tags -- i.e. a broken Rust change is first discovered while
                  # cutting a release. Gate a cargo check on the Tauri paths so it is
                  # caught on the PR instead. Same grep discipline as above: a failed
                  # detector must not silently resolve to "no desktop changes".
                  set +e
                  DESKTOP=$(printf '%s\n' "$CHANGED" | grep -E '^apps/desktop/')
                  DESKTOP_STATUS=$?
                  set -e
                  if [ "$DESKTOP_STATUS" -gt 1 ]; then
                    echo "[FAIL] Desktop-path detection failed (grep exit $DESKTOP_STATUS)."
                    exit 1
                  fi
                  if [ -n "$DESKTOP" ]; then
                    echo "desktop=true" >> "$GITHUB_OUTPUT"
                    echo "Desktop/Tauri paths changed -- running the Rust check:"
                    printf '  %s\n' "$DESKTOP"
                  else
                    echo "desktop=false" >> "$GITHUB_OUTPUT"
                  fi

    build:
        name: Build
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
            - name: Setup Node + install dependencies
              uses: ./.github/actions/setup-node-ci
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - name: Restore Turbo cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo
                  key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}-
                      turbo-${{ runner.os }}-
                  save-always: true
            - name: Build
              run: pnpm run build

            # Uncached, so it runs even when turbo replays a cached dist/**. The
            # artifact uploaded below feeds E2E and (on release paths) the tarball,
            # so it must identify the commit it was built from rather than whichever
            # commit first populated the cache.
            - name: Stamp build metadata
              env:
                  BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  node scripts/stamp-build-metadata.mjs
                  node scripts/stamp-build-metadata.mjs --verify

            - name: Bundle budget check
              run: node scripts/check-bundle-budget.mjs apps/web/dist/assets

            - name: Upload build artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: dist
                  path: apps/web/dist/
                  retention-days: 1

    # ---------------------------------------------------------------------
    # Unit tests + coverage -- runs in parallel with build and verify
    # ---------------------------------------------------------------------
    test:
        name: Unit Tests + Coverage
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
            - name: Setup Node + install dependencies
              uses: ./.github/actions/setup-node-ci
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - name: Restore Turbo cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo
                  key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}-
                      turbo-${{ runner.os }}-
                  save-always: true
            - name: Test + Coverage
              run: pnpm run test:coverage

            - name: Critical path coverage (>=80% lines/functions)
              run: pnpm run check:critical-path-coverage

            - name: Coverage summary (enforced thresholds)
              if: success()
              run: |
                  SUMMARY=apps/web/coverage/coverage-summary.json
                  if [ ! -f "$SUMMARY" ]; then
                    echo "::error::Missing $SUMMARY -- vitest json-summary reporter required"
                    exit 1
                  fi
                  node -e "
                  const fs = require('fs');
                  const s = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')).total;
                  const pct = (k) => (s[k]?.pct ?? 0).toFixed(1);
                  console.log('Coverage total -- lines:', pct('lines') + '%, statements:', pct('statements') + '%, functions:', pct('functions') + '%, branches:', pct('branches') + '%');
                  " "$SUMMARY"

            - name: Upload coverage
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-report
                  path: apps/web/coverage/
                  retention-days: 14

    # ---------------------------------------------------------------------
    # Verify -- lint, types and every source-only gate. Fails fast: a type or
    # lint error now surfaces in ~4 min instead of behind the unit suite.
    # ---------------------------------------------------------------------
    verify:
        name: Lint, Types + Gates
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
            - name: Setup Node + install dependencies
              uses: ./.github/actions/setup-node-ci
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - name: Install pinned uv
              env:
                  UV_VERSION: '0.8.10'
              run: |
                  curl -LsSf "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
                    -o /tmp/uv.tar.gz
                  tar -xzf /tmp/uv.tar.gz -C /tmp
                  sudo install /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv

            - name: Restore Turbo cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo
                  key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}-
                      turbo-${{ runner.os }}-
                  save-always: true
            - name: Lint changed files
              env:
                  LINT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
              run: pnpm run lint:changed

            - name: Lint strict scopes
              run: pnpm run lint:scopes

            - name: Graphify MCP doctor
              run: pnpm run graphify:mcp:doctor

            - name: Doc-metric truth check
              run: node scripts/check-doc-metrics.mjs

            - name: TypeScript build-cache integrity
              run: node scripts/check-tsbuild-cache-integrity.mjs

            - name: jsx-a11y warning ratchet
              run: pnpm run check:a11y-ratchet

            - name: Theme contrast audit (WCAG-AA, advisory findings; fails closed on missing tokens/themes)
              run: node scripts/check-contrast.mjs

            - name: Type check (workspaces)
              run: pnpm exec turbo run typecheck

            - name: Type check (root)
              run: pnpm run typecheck

            - name: Zero-any enforcement
              run: |
                  COUNT=$(grep -rn ": any\b\|as any\b\|<any>" apps/web/services/ apps/web/stores/ apps/web/components/ apps/web/hooks/ apps/web/utils/ apps/web/workers/ --include="*.ts" --include="*.tsx" | grep -v "\.d\.ts:" | grep -v "\.test\." | grep -v "^\s*//" | grep -v "// .*any" | wc -l)
                  echo "Found ${COUNT} any-usage(s) in app source"
                  if [ "$COUNT" -gt 0 ]; then
                    grep -rn ": any\b\|as any\b\|<any>" apps/web/services/ apps/web/stores/ apps/web/components/ apps/web/hooks/ apps/web/utils/ apps/web/workers/ --include="*.ts" --include="*.tsx" | grep -v "\.d\.ts:" | grep -v "\.test\." | grep -v "^\s*//" | grep -v "// .*any"
                    echo "[FAIL] any usage detected in app source -- strict mode requires zero any"
                    exit 1
                  fi
                  echo "[OK] Zero any in app source"

            - name: File budget (changed files)
              run: pnpm run check:file-budget

            - name: Declared-dependency enforcement
              run: pnpm run check:phantom-deps

            - name: Service dependency acyclic check
              run: node scripts/generate-service-map.mjs

            - name: Check i18n completeness
              run: pnpm run check:i18n

            - name: Strain catalog integrity
              run: pnpm run strains:check-integrity

            - name: Audit backlog check (blocks on open CRITICAL or HIGH items)
              run: node scripts/check-audit-backlog.mjs
              continue-on-error: false

            - name: E2E selector stability guard
              run: node scripts/check-e2e-selectors.mjs
              continue-on-error: false

            - name: CSP consistency check
              run: node scripts/security/check-csp-consistency.mjs

    # ---------------------------------------------------------------------
    # Rust / Tauri -- only when apps/desktop changed.
    #
    # Without this, Rust is compiled exclusively by desktop-build.yml on `v*`
    # tags, so a type error or a broken command signature surfaces during a
    # release rather than on the PR that introduced it. `cargo check` + clippy
    # is enough to catch that; the full bundle stays in desktop-build.yml.
    # ---------------------------------------------------------------------
    rust:
        name: Rust (Tauri)
        needs: changes
        if: needs.changes.outputs.desktop == 'true'
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        env:
            CARGO_INCREMENTAL: 0
            RUST_BACKTRACE: short
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  # This job runs cargo, which executes third-party build scripts.
                  # Do not leave a usable git credential in the runner's config.
                  persist-credentials: false

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  toolchain: stable
                  components: clippy, rustfmt

            - name: Rust cache
              uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  workspaces: apps/desktop/src-tauri

            # Same list desktop-build.yml installs; Tauri will not configure without them.
            - name: Install Linux system deps
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    libgtk-3-dev \
                    libsoup-3.0-dev \
                    libjavascriptcoregtk-4.1-dev

            # tauri.conf.json points frontendDist at `../web/dist` (i.e. apps/web/dist).
            # tauri-build wants that directory to exist; it does not need real assets for
            # a type check, and `beforeBuildCommand` only runs for `tauri build`. The
            # real bundle is still produced by desktop-build.yml.
            - name: Stub frontend dist
              run: mkdir -p apps/web/dist && touch apps/web/dist/index.html

            # These three are independent signals, so one failure must not hide
            # the others -- the same mistake the `security` job used to make, and
            # this job reproduced it on its very first run: clippy failed, the
            # unit tests never ran, and the diagnosis was half a picture.
            # `continue-on-error` on the steps + an aggregating gate keeps every
            # result visible without paying for three separate Rust build jobs.
            #
            # `--locked` everywhere: the whole point of committing Cargo.lock is
            # that CI must fail on drift rather than quietly resolve around it.
            - name: Formatting
              id: fmt
              continue-on-error: true
              working-directory: apps/desktop/src-tauri
              run: cargo fmt --all -- --check

            - name: Clippy
              id: clippy
              continue-on-error: true
              working-directory: apps/desktop/src-tauri
              run: cargo clippy --locked --all-targets -- -D warnings

            - name: Unit tests
              id: tests
              continue-on-error: true
              working-directory: apps/desktop/src-tauri
              run: cargo test --locked --lib

            - name: Aggregate Rust results
              if: always()
              run: |
                  echo "fmt:    ${{ steps.fmt.outcome }}"
                  echo "clippy: ${{ steps.clippy.outcome }}"
                  echo "tests:  ${{ steps.tests.outcome }}"
                  echo "---"
                  FAILED=0
                  [[ "${{ steps.fmt.outcome }}"    == "success" ]] || { echo "[FAIL] cargo fmt";    FAILED=1; }
                  [[ "${{ steps.clippy.outcome }}" == "success" ]] || { echo "[FAIL] cargo clippy"; FAILED=1; }
                  [[ "${{ steps.tests.outcome }}"  == "success" ]] || { echo "[FAIL] cargo test";   FAILED=1; }
                  if [[ "$FAILED" -ne 0 ]]; then exit 1; fi
                  echo "[PASS] Rust fmt, clippy and unit tests all green."

    # ---------------------------------------------------------------------
    # Security -- hard-fail, no continue-on-error
    # ---------------------------------------------------------------------
    security:
        name: Security
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              id: checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: Setup Node + install dependencies
              id: setup
              uses: ./.github/actions/setup-node-ci
              with:
                  node-version: ${{ env.NODE_VERSION }}

            # Every scan below is guarded with `always() && setup succeeded` so
            # that ONE failing control no longer hides the rest. These are
            # independent checks: a red dependency audit used to skip the secret
            # scan and the Trojan-Source scan entirely, which meant a green
            # Security job was the only evidence they had ever run. They still
            # hard-fail the job (no continue-on-error), so the `CI Status` merge
            # gate is exactly as strict as before -- just better informed.

            # The production graph is held to the SAME bar as everything else.
            # This step used to be `--audit-level=critical`, i.e. laxer for the
            # code we actually ship than for dev tooling: it printed
            # "Severity: 1 high" and exited 0.
            - name: Security audit (high, production)
              if: always() && steps.setup.outcome == 'success'
              run: pnpm audit --audit-level=high --prod

            - name: Security audit (high, all deps)
              if: always() && steps.setup.outcome == 'success'
              run: pnpm audit --audit-level=high

            # Guards the pnpm-overrides / dependabot-ignore pair against the
            # silent drift that let GHSA-pm4m-ph32-ghv5 through: see the script
            # header and the comment above `overrides:` in pnpm-workspace.yaml.
            - name: Override / dependabot-ignore drift check
              if: always() && steps.setup.outcome == 'success'
              run: node scripts/security/check-override-floors.mjs

            - name: Trojan-source scan
              if: always() && steps.setup.outcome == 'success'
              run: pnpm run security:trojan-source

            # Trivy removed 2026-03-24: supply-chain attack (GHSA-69fq-xp46-6x23).
            # Replaced by Grype in security-full.yml (filesystem).
            # CI filesystem scanning covered by pnpm audit + Snyk + CodeQL.
            # Guarded on the checkout rather than the install: secret scanning
            # needs the working tree, not node_modules, so a registry outage
            # must not silently disable it.
            - name: Gitleaks secret scan
              if: always() && steps.checkout.outcome == 'success'
              run: |
                  GITLEAKS_VERSION="8.24.3"
                  curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
                    | tar -xz -C /usr/local/bin gitleaks
                  gitleaks detect --source . --no-banner --redact --config .gitleaks.toml -v

    # ---------------------------------------------------------------------
    # E2E -- Playwright with sharding (reuses dist from the build job)
    # ---------------------------------------------------------------------
    e2e:
        name: E2E Tests (${{ matrix.shard }})
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 50
        strategy:
            fail-fast: false
            matrix:
                shard: ['1/2', '2/2']
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Setup Node + install dependencies
              uses: ./.github/actions/setup-node-ci
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      playwright-browsers-${{ runner.os }}-

            - name: Install Playwright OS dependencies
              run: pnpm run test:e2e:deps:ci

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm run test:e2e:install:ci

            - name: Download build artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: dist
                  path: apps/web/dist/

            - name: Run E2E tests (Chromium)
              working-directory: apps/web
              run: |
                  START_TIME=$SECONDS
                  pnpm exec playwright test -c playwright.config.ts --project=chromium --project=mobile-chrome --grep-invert "Visual Regression|App Screenshots" --shard=${{ matrix.shard }} --retries=2
                  echo "E2E Chromium shard ${{ matrix.shard }} duration: $(( SECONDS - START_TIME ))s"
              timeout-minutes: 30

            - name: Upload Playwright traces on failure
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: e2e-traces-shard${{ strategy.job-index }}-${{ github.run_id }}
                  path: apps/web/test-results/
                  retention-days: 7

    # Firefox only (WebKit is excluded -- see the note further down). This job is
    # advisory: continue-on-error means it can never block a merge, so on a pull
    # request it spends two runners on a signal nobody is allowed to gate on.
    # Cross-browser breakage is almost always introduced by a browser or Playwright
    # update rather than by one PR's diff, so main and workflow_dispatch catch it
    # just as well, one build later.
    #
    # A PR that does touch browser-sensitive code opts back in with the
    # `e2e-cross-browser` label.
    e2e-cross-browser:
        name: E2E Cross-Browser (${{ matrix.shard }})
        needs: build
        if: >-
            always() && needs.build.result == 'success' &&
            (github.event_name != 'pull_request' ||
            contains(github.event.pull_request.labels.*.name, 'e2e-cross-browser'))
        continue-on-error: true
        runs-on: ubuntu-latest
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                shard: ['1/2', '2/2']
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Setup Node + install dependencies
              uses: ./.github/actions/setup-node-ci
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      playwright-browsers-${{ runner.os }}-

            - name: Install Playwright OS dependencies
              run: pnpm run test:e2e:deps:ci

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm run test:e2e:install:ci

            - name: Download build artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: dist
                  path: apps/web/dist/

            - name: Run E2E tests (Firefox)
              if: steps.playwright-cache.outcome != 'failure'
              working-directory: apps/web
              run: |
                  START_TIME=$SECONDS
                  pnpm exec playwright test -c playwright.config.ts --project=firefox --grep-invert "Visual Regression|App Screenshots|WebGPU|Bluetooth|mobile-no-overflow" --shard=${{ matrix.shard }}
                  echo "E2E Firefox shard ${{ matrix.shard }} duration: $(( SECONDS - START_TIME ))s"
              timeout-minutes: 40

            # WebKit/Safari: excluded from CI — post-hydration service init is too slow/flaky
            # on GitHub runners; Chromium shard + local `playwright test --project=webkit` cover it.

            - name: Upload Playwright traces on failure
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: e2e-cross-browser-traces-shard${{ strategy.job-index }}-${{ github.run_id }}
                  path: apps/web/test-results/
                  retention-days: 7

    # IoT integration: covered by e2e-integration.yml

    # ---------------------------------------------------------------------
    # Advisory -- metrics & hygiene; never blocks merge (continue-on-error)
    # ---------------------------------------------------------------------
    advisory:
        name: Advisory Metrics
        needs: build
        if: always() && needs.build.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        continue-on-error: true
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Download build artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: dist
                  path: apps/web/dist/

            - name: Critical path metrics
              continue-on-error: true
              run: node scripts/measure-critical-path.mjs apps/web/dist/assets

            - name: File budget (grandfathered god-files)
              continue-on-error: true
              env:
                  FILE_BUDGET_ADVISORY: '1'
              run: node scripts/check-file-budget.mjs

            - name: LocalStorage allowlist
              continue-on-error: true
              run: node scripts/security/check-localstorage-usage.mjs

            - name: Advisory summary
              if: always()
              run: echo "::notice::Advisory job finished — failures here do not block merge."

    # ---------------------------------------------------------------------
    # CI Gate -- build + test + verify + security + Chromium E2E all required
    # ---------------------------------------------------------------------
    ci-status:
        name: "\u2705 CI Status"
        if: always()
        # build + test + verify together are exactly what the old `quality` job
        # covered \u2014 splitting it must not narrow the merge gate.
        #
        # `e2e` is in this list deliberately. It was absent, and the consequence was
        # not theoretical: this check reached SUCCESS while both Chromium shards
        # were still `in_progress`, three separate times on PR #474 alone. A PR was
        # therefore mergeable -- by the repository's own required check -- with the
        # browser tests unfinished, and a shard failing afterwards changed nothing.
        # A required gate that concludes before its evidence is in is not a gate.
        needs: [changes, build, test, verify, security, rust, e2e]
        runs-on: ubuntu-latest
        steps:
            - name: Check all jobs passed
              run: |
                  if [[ "${{ needs.changes.result }}" != "success" ]]; then
                    echo "[FAIL] Could not determine whether code changed -- refusing to pass."
                    exit 1
                  fi

                  # Rust is checked BEFORE the docs-only exit, because the two
                  # detectors are independent: `code` keys off the DOCS_ONLY regex,
                  # `desktop` off `^apps/desktop/`. A change limited to
                  # apps/desktop/README.md therefore yields code=false AND
                  # desktop=true -- the rust job runs, can fail, and an early
                  # `exit 0` here would wave it through. That is exactly the silent
                  # bypass this gate exists to prevent.
                  RUST_FAILED=0
                  if [[ "${{ needs.changes.outputs.desktop }}" == "true" ]]; then
                    echo "Rust:     ${{ needs.rust.result }}"
                    if [[ "${{ needs.rust.result }}" != "success" ]]; then
                      echo "[FAIL] Rust / Tauri checks failed"; RUST_FAILED=1
                    fi
                  fi

                  if [[ "${{ needs.changes.outputs.code }}" != "true" ]]; then
                    if [[ "$RUST_FAILED" -ne 0 ]]; then exit 1; fi
                    echo "[OK] Docs-only change -- no code pipeline to run."
                    exit 0
                  fi

                  echo "Build:    ${{ needs.build.result }}"
                  echo "Test:     ${{ needs.test.result }}"
                  echo "Verify:   ${{ needs.verify.result }}"
                  echo "Security: ${{ needs.security.result }}"
                  echo "E2E:      ${{ needs.e2e.result }}"
                  echo "---"
                  FAILED=0
                  if [[ "${{ needs.build.result }}" != "success" ]]; then
                    echo "[FAIL] Build / bundle budget failed"; FAILED=1
                  fi
                  if [[ "${{ needs.test.result }}" != "success" ]]; then
                    echo "[FAIL] Unit tests / coverage gates failed"; FAILED=1
                  fi
                  if [[ "${{ needs.verify.result }}" != "success" ]]; then
                    echo "[FAIL] Lint / types / source gates failed"; FAILED=1
                  fi
                  if [[ "${{ needs.security.result }}" != "success" ]]; then
                    echo "[FAIL] Security checks failed"; FAILED=1
                  fi

                  # Chromium E2E is now blocking. `e2e` runs a 2-shard matrix and
                  # `needs.e2e.result` is the aggregate across both, so one red shard
                  # fails this. Note the comparison is against "success" and NOT a
                  # not-equal-to-failure test: `cancelled`, `skipped` and the empty
                  # result must all fail here. A gate that accepts anything other
                  # than a green run is how E2E became advisory in the first place.
                  if [[ "${{ needs.e2e.result }}" != "success" ]]; then
                    echo "[FAIL] Chromium E2E failed or did not complete"; FAILED=1
                  fi

                  # Folded in from the pre-docs-exit check above. `rust` is
                  # path-gated, so `skipped` is legitimate when apps/desktop was
                  # untouched -- but a skip is never accepted while desktop files
                  # DID change.
                  if [[ "$RUST_FAILED" -ne 0 ]]; then FAILED=1; fi
                  if [[ "$FAILED" -ne 0 ]]; then exit 1; fi
                  echo "[PASS] CI merge gate passed (build + test + verify + security + Chromium E2E)"
