name: Cleanup Merged Branches

on:
    schedule:
        # Weekly — Sunday 04:00 UTC (after deployment cleanup at 03:00)
        - cron: '0 4 * * 0'
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'List candidates only (no deletes)'
                required: false
                type: boolean
                default: false
            include_merged_pr_branches:
                description: 'Also delete squash/rebase-merged PR branches'
                required: false
                type: boolean
                default: true

permissions: {}

jobs:
    cleanup:
        name: Prune merged PR branches
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Cleanup stale remote branches
              uses: ./.github/actions/cleanup-branches
              with:
                  dry_run: ${{ inputs.dry_run || 'false' }}
                  include_merged_pr_branches: ${{ github.event_name != 'workflow_dispatch' || inputs.include_merged_pr_branches }}
