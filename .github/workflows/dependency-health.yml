name: Dependency Health

# main can sit unchanged for weeks while advisories move. This scheduled lane
# re-audits the frozen lockfile and fails on new High/Critical findings.
# It does not modify the repository and it does not dismiss alerts.

on:
    schedule:
        - cron: '17 4 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: dependency-health-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # The desktop shell's Rust lockfile, against the RustSec database. Separate from the
    # npm job so neither hides the other, and it needs no Node install.
    rust-advisories:
        name: Rust advisories (cargo audit)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            # A prebuilt static release, verified before it runs: `cargo install` would compile
            # it for minutes on every run. Version and checksum are the same in ci.yml and
            # dependency-health.yml (scripts/security/cargo-audit-workflow.test.mjs checks it).
            - name: Install cargo-audit (pinned, checksum-verified)
              env:
                  CARGO_AUDIT_VERSION: '0.23.0'
                  CARGO_AUDIT_SHA256: '4f01c74ed84b2dffd0b1d37012a62cdf2a92c96e25bdf8eec7fcc0d4d3eb7811'
              run: |
                  set -euo pipefail
                  name="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
                  curl -fsSLo "${RUNNER_TEMP}/cargo-audit.tgz" \
                    "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/${name}.tgz"
                  echo "${CARGO_AUDIT_SHA256}  ${RUNNER_TEMP}/cargo-audit.tgz" | sha256sum -c -
                  tar -xzf "${RUNNER_TEMP}/cargo-audit.tgz" -C "${RUNNER_TEMP}" "${name}/cargo-audit"
                  install -m 755 "${RUNNER_TEMP}/${name}/cargo-audit" "${RUNNER_TEMP}/cargo-audit-bin"
                  "${RUNNER_TEMP}/cargo-audit-bin" --version

            # Fails on vulnerabilities only; unmaintained, unsound and yanked crates are
            # printed as warnings. It compiles nothing.
            - name: cargo audit (desktop lockfile)
              run: '"${RUNNER_TEMP}/cargo-audit-bin" audit --file apps/desktop/src-tauri/Cargo.lock'

    audit:
        name: Dependency audit
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Setup Node + install dependencies
              id: setup
              uses: ./.github/actions/setup-node-ci

            # Independent controls. `always()` keeps a failed audit from
            # skipping the later checks. A failed step still fails the job.
            # Setup must have succeeded first.
            - name: Security audit (high, production)
              if: always() && steps.setup.outcome == 'success'
              run: pnpm audit --audit-level=high --prod

            - name: Security audit (high, all deps)
              if: always() && steps.setup.outcome == 'success'
              run: pnpm audit --audit-level=high

            - name: Override floor check
              if: always() && steps.setup.outcome == 'success'
              run: node scripts/security/check-override-floors.mjs

            - name: Audit exception expiry and registry
              if: always() && steps.setup.outcome == 'success'
              run: node scripts/security/check-audit-exceptions.mjs --check-registry

            - name: Updater policy
              if: always() && steps.setup.outcome == 'success'
              run: node scripts/security/check-updater-policy.mjs
