name: Deploy to Cloudflare Pages

# Secondary production mirror (root base path). Requires repository secrets:
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Primary: GitHub Pages (deploy.yml) + Vercel (vercel.json / dashboard).

on:
    workflow_run:
        # CI on main publishes production. Cloudflare Preview Build publishes
        # a PR preview. This file is taken from the default branch, so a PR
        # cannot rewrite the steps that read the Cloudflare token. Do not add
        # pull_request here: that event runs the workflow from the merge commit.
        workflows: [CI, Cloudflare Preview Build]
        types: [completed]

permissions:
    contents: read

concurrency:
    group: ${{ github.event.workflow_run.name == 'Cloudflare Preview Build' && format('cloudflare-preview-{0}', github.event.workflow_run.pull_requests[0].number) || 'cloudflare-pages-main' }}
    cancel-in-progress: true

env:
    NODE_VERSION: '24'
    CF_PROJECT_NAME: cannaguide-2025
    CF_PAGES_URL: https://cannaguide-2025.pages.dev
    # The commit this production deployment is FOR. On `workflow_run`,
    # `github.sha` is the default branch head at dispatch time, NOT the commit
    # whose CI succeeded -- so if main advances between CI finishing and this
    # workflow starting, using it would build, deploy and then STAMP an
    # untested commit as verified. Preview publishes do not read this value;
    # they deploy the artifact built for the pull request head.
    DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
    gate:
        name: Cloudflare secrets gate
        # Only the two trusted workflow_run shapes may see the token. A CI run
        # on a pull request still triggers this workflow, and this if skips it
        # before the secret check.
        if: >-
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            (
              (github.event.workflow_run.name == 'CI' &&
               github.event.workflow_run.head_branch == 'main') ||
              (github.event.workflow_run.name == 'Cloudflare Preview Build' &&
               github.event.workflow_run.event == 'pull_request' &&
               github.event.workflow_run.pull_requests[0].base.ref == 'main')
            )
        runs-on: ubuntu-latest
        outputs:
            configured: ${{ steps.secrets.outputs.configured }}
        steps:
            - name: Check Cloudflare secrets
              id: secrets
              run: |
                  if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
                    echo "configured=true" >> "$GITHUB_OUTPUT"
                    echo "::notice::Cloudflare secrets present — deploy jobs may run."
                  else
                    echo "configured=false" >> "$GITHUB_OUTPUT"
                    echo "::notice title=Cloudflare Pages::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping wrangler deploy."
                  fi

    deploy:
        name: Build & Deploy (Production)
        needs: gate
        # Advisory mirror -- GitHub Pages + Vercel are primary. "Advisory" is
        # enforced by NOT listing this workflow among the ruleset's required
        # checks, which is the honest mechanism: a red run cannot block a merge.
        #
        # It is deliberately NOT enforced with `continue-on-error: true` any more.
        # That reported success for a deploy that never happened -- observed on
        # PR #474, where the run was green while wrangler had aborted with
        # ERR_PNPM_ADDING_TO_ROOT and no preview URL was ever posted. A check that
        # is green when the deploy failed is worse than no check: it is a claim
        # nobody can act on. Optional must mean "does not block", never "cannot
        # go red".
        #
        # The job only runs when the secrets gate passed, so a run that starts is
        # a run that is expected to succeed.
        if: >-
            needs.gate.outputs.configured == 'true' &&
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.name == 'CI' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  # Without this the job builds whatever main points at now, which
                  # is not necessarily the commit whose CI passed.
                  ref: ${{ env.DEPLOY_SHA }}
                  # No git write operations happen after checkout, so the
                  # GITHUB_TOKEN doesn't need to be readable from .git/config by
                  # build/deploy tooling.
                  persist-credentials: false

            - name: Setup Node + install dependencies
              uses: ./.github/actions/setup-node-ci
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Restore Turbo cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo
                  key: turbo-cf-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      turbo-cf-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}-
                      turbo-${{ runner.os }}-

            - name: Build for Cloudflare Pages
              env:
                  BUILD_BASE_PATH: /
              run: |
                  echo "::group::vite build (BUILD_BASE_PATH=/)"
                  pnpm run build
                  echo "::endgroup::"

            # Uncached: `pnpm run build` is a turbo task caching dist/**, so on a
            # cache hit the previous commit's version.json is replayed. Stamp and
            # assert here so the preview/production upload carries this commit.
            - name: Stamp build metadata
              env:
                  BUILD_COMMIT: ${{ env.DEPLOY_SHA }}
              run: |
                  node scripts/stamp-build-metadata.mjs
                  node scripts/stamp-build-metadata.mjs --verify
                  echo "[OK] Build complete — dist size: $(du -sh apps/web/dist | cut -f1)"

            - name: Verify wrangler CLI
              run: pnpm exec wrangler --version

            - name: Ensure Cloudflare Pages project exists
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  set +e
                  OUT=$(pnpm exec wrangler pages project create "${{ env.CF_PROJECT_NAME }}" --production-branch=main 2>&1)
                  CODE=$?
                  echo "$OUT"
                  if [ "$CODE" -eq 0 ]; then
                    echo "::notice::Created Pages project ${{ env.CF_PROJECT_NAME }}"
                  elif echo "$OUT" | grep -qiE 'already exists|80000133|8000002'; then
                    echo "::notice::Pages project ${{ env.CF_PROJECT_NAME }} already exists"
                  else
                    echo "::warning::Could not create Pages project (exit ${CODE}). Deploy will retry; create manually in the Cloudflare dashboard if this persists."
                  fi
                  set -e
            # Cloudflare Pages rejects any single file over 25 MiB, and does so
            # only after uploading the rest -- so the failure arrives late and names
            # the file in wrangler output nobody reads when the job is advisory.
            # Check first and say exactly what is wrong.
            #
            # This is not hypothetical: assets/ort-wasm-simd-threaded.jsep-*.wasm is
            # 25.6 MiB, so the deploy has never been able to succeed. It was hidden
            # because the job carried continue-on-error, which this PR removes.
            - name: Check Cloudflare Pages file-size limit
              uses: ./.github/actions/check-pages-file-size
              with:
                  path: apps/web/dist

            # Uses the workspace's own lockfile-pinned wrangler instead of
            # cloudflare/wrangler-action. The action was pinned to wranglerVersion
            # '4.105.0' while package.json carries ^4.110.0, so it tried to install
            # a DIFFERENT version at the repo root and died with:
            #
            #     ERR_PNPM_ADDING_TO_ROOT
            #
            # `pnpm exec` runs the version the lockfile already resolved, so there
            # is nothing to install, no version to drift, and no second source of
            # truth for which wrangler this repo uses.
            - name: Deploy to Cloudflare Pages
              id: deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  set -o pipefail
                  OUT=$(pnpm exec wrangler pages deploy apps/web/dist \
                          --project-name="${CF_PROJECT_NAME}" \
                          --branch=main 2>&1 | tee /dev/stderr)

                  # wrangler exits 0 on success, so pipefail above is what makes a
                  # failed deploy fail this step. The URL check below additionally
                  # catches a "successful" run that deployed nothing -- `|| true` on
                  # the grep is required for that check to ever run: under `bash -e`
                  # + `pipefail`, a no-match grep (exit 1) would abort the
                  # `URL=$(...)` assignment itself and skip the guard entirely.
                  URL=$(printf '%s' "$OUT" | grep -oE 'https://[A-Za-z0-9._-]+\.pages\.dev' | tail -1 || true)
                  if [ -z "$URL" ]; then
                    echo "::error::wrangler reported success but printed no deployment URL."
                    exit 1
                  fi
                  echo "deployment-url=${URL}" >> "$GITHUB_OUTPUT"
                  echo "[OK] Deployed to ${URL}"

            - name: Post-deploy health check
              run: |
                  CF_URL="${{ steps.deploy.outputs.deployment-url || env.CF_PAGES_URL }}"
                  echo "Health-checking ${CF_URL} ..."
                  STATUS=$(curl -sSo /dev/null -w '%{http_code}' --max-time 20 "${CF_URL}")
                  if [ "$STATUS" = "200" ]; then
                    echo "[OK] Cloudflare Pages healthy (HTTP ${STATUS})"
                  else
                    echo "::error::Unexpected HTTP ${STATUS} from ${CF_URL}"
                    exit 1
                  fi

            # Completes the artifact-identity chain for this deploy path. The build
            # stamps dist/version.json with DEPLOY_SHA and asserts it before upload
            # (#486); this confirms the commit actually being SERVED.
            #
            # The first version of this step could not fail: it carried
            # `continue-on-error: true` AND only warned on a mismatch, so it was
            # green whether the served commit matched or not. That is the exact
            # defect this PR exists to remove -- a check reporting success while
            # establishing nothing -- reintroduced by me one step below where I had
            # just deleted it. Caught in review by CodeAnt.
            #
            # Edge-cache lag was the real concern behind that, and retrying is the
            # correct answer to it, not ignoring the result. Same shape as
            # deploy.yml's Pages check: poll until the edge catches up, then fail if
            # it never does.
            - name: Verify served version marker
              env:
                  EXPECTED_SHA: ${{ env.DEPLOY_SHA }}
              run: |
                  CF_URL="${{ steps.deploy.outputs.deployment-url || env.CF_PAGES_URL }}"
                  URL="${CF_URL%/}/version.json"
                  echo "[INFO] Expecting ${EXPECTED_SHA} at ${URL}"

                  for attempt in $(seq 1 15); do
                    BODY=$(curl -fsSL --max-time 20 "${URL}" 2>/dev/null || echo "")
                    if [ -n "${BODY}" ]; then
                      SERVED=$(printf '%s' "${BODY}" | jq -r '.commit // empty')
                      if [ "${SERVED}" = "${EXPECTED_SHA}" ]; then
                        echo "[OK] Serving ${SERVED} (attempt ${attempt})."
                        exit 0
                      fi
                      echo "  attempt ${attempt}: serving ${SERVED:-<none>}, waiting for ${EXPECTED_SHA}"
                    else
                      echo "  attempt ${attempt}: no version.json yet"
                    fi
                    sleep 10
                  done

                  echo "::error::Cloudflare is not serving ${EXPECTED_SHA} after 15 attempts."
                  echo "        Last served: ${SERVED:-<none>}"
                  echo "        Either the deploy did not take effect, or it published a"
                  echo "        different commit than the one this run built."
                  exit 1

    publish-preview:
        name: Publish PR preview
        needs: gate
        # The artifact was built without the token. This job runs the default
        # branch workflow, checks the metadata against the triggering event,
        # and only then calls wrangler. It does not checkout or execute the
        # pull request.
        if: >-
            needs.gate.outputs.configured == 'true' &&
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.name == 'Cloudflare Preview Build' &&
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            github.event.workflow_run.pull_requests[0].base.ref == 'main'
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            pull-requests: write
        timeout-minutes: 25
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout default branch
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Setup Node + install dependencies
              uses: ./.github/actions/setup-node-ci
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Download preview dist
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: cloudflare-preview-dist
                  path: preview-dist
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}

            - name: Download preview metadata
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: cloudflare-preview-meta
                  path: preview-meta
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}

            - name: Validate preview metadata
              id: meta
              env:
                  EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
                  EVENT_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
              run: node scripts/cloudflare-preview-meta.mjs check

            - name: Check Cloudflare Pages file-size limit
              uses: ./.github/actions/check-pages-file-size
              with:
                  path: preview-dist

            - name: Verify wrangler CLI
              run: pnpm exec wrangler --version

            - name: Deploy preview to Cloudflare Pages
              id: preview-deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  PREVIEW_BRANCH: ${{ steps.meta.outputs.branch }}
              run: |
                  set -o pipefail
                  OUT=$(pnpm exec wrangler pages deploy preview-dist \
                          --project-name="${CF_PROJECT_NAME}" \
                          --branch="${PREVIEW_BRANCH}" 2>&1 | tee /dev/stderr)
                  URL=$(printf '%s' "$OUT" | grep -oE 'https://[A-Za-z0-9._-]+\.pages\.dev' | tail -1 || true)
                  if [ -z "$URL" ]; then
                    echo "::error::wrangler reported success but printed no deployment URL."
                    exit 1
                  fi
                  echo "deployment-url=${URL}" >> "$GITHUB_OUTPUT"
                  echo "[OK] Preview deployed to ${URL}"

            - name: Verify served version marker
              env:
                  EXPECTED_SHA: ${{ steps.meta.outputs.sha }}
                  CF_URL: ${{ steps.preview-deploy.outputs.deployment-url }}
              run: |
                  URL="${CF_URL%/}/version.json"
                  echo "[INFO] Expecting ${EXPECTED_SHA} at ${URL}"
                  for attempt in $(seq 1 15); do
                    BODY=$(curl -fsSL --max-time 20 "${URL}" 2>/dev/null || echo "")
                    if [ -n "${BODY}" ]; then
                      SERVED=$(printf '%s' "${BODY}" | jq -r '.commit // empty')
                      if [ "${SERVED}" = "${EXPECTED_SHA}" ]; then
                        echo "[OK] Serving ${SERVED} (attempt ${attempt})."
                        exit 0
                      fi
                      echo "  attempt ${attempt}: serving ${SERVED:-<none>}, waiting for ${EXPECTED_SHA}"
                    else
                      echo "  attempt ${attempt}: no version.json yet"
                    fi
                    sleep 10
                  done
                  echo "::error::Preview is not serving ${EXPECTED_SHA} after 15 attempts."
                  exit 1

            - name: Comment preview URL on PR
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  DEPLOY_URL: ${{ steps.preview-deploy.outputs.deployment-url }}
                  DEPLOY_SHA_FULL: ${{ steps.meta.outputs.sha }}
                  PR_NUMBER: ${{ steps.meta.outputs.pr }}
                  PR_HEAD_REF: ${{ steps.meta.outputs.branch }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              with:
                  script: |
                      const deployUrl = process.env.DEPLOY_URL;
                      const sha = process.env.DEPLOY_SHA_FULL.substring(0, 7);
                      const headRef = process.env.PR_HEAD_REF;
                      const runUrl = process.env.RUN_URL;
                      const pr = Number(process.env.PR_NUMBER);
                      const marker = '<!-- cf-preview-comment -->';
                      const body = [
                        marker,
                        '### Cloudflare Pages Preview',
                        '',
                        '| | |',
                        '|---|---|',
                        `| **Preview URL** | ${deployUrl} |`,
                        `| **Commit** | \`${sha}\` |`,
                        `| **Branch** | \`${headRef}\` |`,
                        '',
                        `_Deployed by [deploy-cloudflare.yml](${runUrl})_`,
                      ].join('\n');

                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: pr,
                        per_page: 50,
                      });
                      const existing = comments.find((c) => c.body && c.body.includes(marker));

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: pr,
                          body,
                        });
                      }

    # -------------------------------------------------------------------------
    # PRUNE -- GitHub Deployments API (all environments, keep 3 newest each)
    # Runs after a successful production or preview publish.
    # -------------------------------------------------------------------------
    prune-deployments:
        name: Prune stale GitHub deployments
        needs: [deploy, publish-preview]
        # Every CI completion triggers this workflow. Prune only after a
        # real Cloudflare publish, not after a skipped pull-request CI run.
        if: >-
            always() && !cancelled() &&
            (needs.deploy.result == 'success' || needs.publish-preview.result == 'success')
        runs-on: ubuntu-latest
        continue-on-error: true
        permissions:
            contents: write
            deployments: write
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Prune stale GitHub deployments (keep 3 per environment)
              continue-on-error: true
              uses: ./.github/actions/prune-deployments
              with:
                  keep_count: '3'

            - name: Prune merged and closed PR branches
              continue-on-error: true
              uses: ./.github/actions/cleanup-branches
