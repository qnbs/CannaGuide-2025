name: Desktop Build (Tauri v2)

# Release Publish calls this workflow for a tag and verifies its output before any
# release exists; it no longer runs on its own for a tag, so the two cannot race.
# A manual run on main is a build qualification only (Actions artifacts, no release).
# Every build is launched for real (desktop runtime smoke) before its bundles are
# kept: v1.12.0 compiled, bundled, signed and verified, and then exited at startup on
# every platform. A pull request that touches the desktop shell or the web app's
# start gets the same smoke on an unsigned build (pr-smoke, no secrets).
on:
    pull_request:
        branches: [main]
        paths:
            - 'apps/desktop/**'
            - 'apps/web/bootstrap/**'
            - 'apps/web/services/desktop*.ts'
            # The startup report reads the hydration source and the snapshot from these.
            - 'apps/web/stores/indexedDBStorage.ts'
            - 'apps/web/stores/store.ts'
            - 'apps/web/bootstrap/persistenceCoordinator.ts'
            # The quit save decides when it has settled by comparing these inputs.
            - 'apps/web/services/persistedSnapshotFormat.ts'
            - 'apps/web/index.html'
            # The service worker stands down in the desktop shell (GH #931).
            - 'apps/web/public/sw.js'
            - 'apps/web/components/common/ReloadPrompt.tsx'
            - 'scripts/desktop-smoke.mjs'
            - 'scripts/desktop-smoke-ci.mjs'
            - 'scripts/desktop-smoke-profile.mjs'
            - '.node-version'
            - '.github/actions/setup-node-ci/action.yml'
            - '.github/workflows/desktop-build.yml'
    workflow_dispatch:
    workflow_call:
        inputs:
            ref:
                description: 'Commit to build: the resolved release commit'
                required: true
                type: string
            tag:
                description: 'Release tag the assets are for (vX.Y.Z)'
                required: true
                type: string
        secrets:
            TAURI_SIGNING_PRIVATE_KEY:
                required: true
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
                required: false
            WINDOWS_CERTIFICATE_THUMBPRINT:
                required: false
            APPLE_CERTIFICATE:
                required: false
            APPLE_CERTIFICATE_PASSWORD:
                required: false
            APPLE_SIGNING_IDENTITY:
                required: false
            APPLE_ID:
                required: false
            APPLE_PASSWORD:
                required: false
            APPLE_TEAM_ID:
                required: false

permissions:
    contents: read

env:
    CARGO_INCREMENTAL: 0
    RUST_BACKTRACE: short

jobs:
    build:
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                    - platform: macos-latest
                      target: aarch64-apple-darwin
                    - platform: macos-latest
                      target: x86_64-apple-darwin
                    - platform: windows-latest
                      target: x86_64-pc-windows-msvc

        runs-on: ${{ matrix.platform }}
        timeout-minutes: 60
        permissions:
            contents: read
        env:
            # A flag only, never the secret: selects the signed macOS build step.
            HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  # The release commit when called by Release Publish, else this run's.
                  ref: ${{ inputs.ref || github.sha }}
                  # The build pushes nothing; keep no Git credentials in the workspace,
                  # which is uploaded in part as release input.
                  persist-credentials: false

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}

            - name: Rust cache
              uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: apps/desktop/src-tauri

            - name: Install Linux system deps
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    libgtk-3-dev \
                    libsoup-3.0-dev \
                    libjavascriptcoregtk-4.1-dev

            # Same setup as CI: Corepack provides pnpm from package.json's
            # packageManager. pnpm/action-setup is not on this repository's
            # allowed-actions list, and referencing it made every run of this
            # workflow fail at startup, including the v1.8.2-v1.10.0 tag pushes.
            - name: Setup Node + install dependencies
              uses: ./.github/actions/setup-node-ci

            # tauri-bundler starts macOS code signing as soon as APPLE_CERTIFICATE is
            # set -- even to the empty string an unconfigured secret expands to -- and
            # then fails on the keychain import (run 40486452675). Only this step
            # receives the Apple credentials, and only when a certificate exists;
            # every other build, including unprovisioned macOS, runs unsigned below.
            - name: Build Tauri (signed macOS)
              if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
              uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Updater signing -- secrets are optional in PR builds and must
                  # be configured for tagged releases (Settings -> Secrets and
                  # variables -> Actions). Without these the produced artefacts
                  # are unsigned and `tauri-plugin-updater` will reject them.
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  # Windows code signing (D-05). Optional until an EV certificate
                  # thumbprint is configured.
                  WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
                  # macOS code signing (D-05).
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              with:
                  projectPath: apps/desktop
                  tauriScript: pnpm tauri
                  # The overlay turns on updater bundles and their minisign
                  # signatures for this build only; tauri.conf.json leaves them off
                  # so a local `tauri build` needs no signing key.
                  args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json

            - name: Build Tauri
              if: runner.os != 'macOS' || env.HAS_APPLE_CERTIFICATE != 'true'
              uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Updater signing -- secrets are optional in PR builds and must
                  # be configured for tagged releases (Settings -> Secrets and
                  # variables -> Actions). Without these the produced artefacts
                  # are unsigned and `tauri-plugin-updater` will reject them.
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  # Windows code signing (D-05). Optional until an EV certificate
                  # thumbprint is configured.
                  WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
              with:
                  projectPath: apps/desktop
                  tauriScript: pnpm tauri
                  # The overlay turns on updater bundles and their minisign
                  # signatures for this build only; tauri.conf.json leaves them off
                  # so a local `tauri build` needs no signing key.
                  args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json

            - name: Runtime smoke
              # Release gate: a bundle that does not start is never uploaded, so verify
              # and Release Publish (which needs verify) stop here.
              shell: bash
              env:
                  TARGET: ${{ matrix.target }}
              run: node scripts/desktop-smoke-ci.mjs --target "$TARGET" --bundle-dir "apps/desktop/src-tauri/target/$TARGET/release/bundle"

            - name: Upload runtime smoke evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: desktop-smoke-${{ matrix.target }}
                  path: desktop-smoke/
                  if-no-files-found: warn
                  retention-days: 14

            - name: Upload artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: desktop-${{ matrix.target }}
                  # Installers plus the updater bundles and their minisign signatures
                  # (tauri.updater.conf.json): scripts/release/desktop-release-manifest.mjs
                  # verifies them and writes latest.json before anything is published.
                  path: |
                      apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
                      apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
                      apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
                      apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
                      apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
                      apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
                      apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
                  if-no-files-found: error
                  retention-days: 14

    # -----------------------------------------------------------------
    # Runtime smoke for a pull request -- unsigned build, no secrets
    # -----------------------------------------------------------------
    # The same launch test as the build job, on Linux (.deb, AppImage), Windows
    # (NSIS, MSI) and Apple Silicon, before the change merges. No updater overlay, so
    # nothing is signed and no secret is read; the bundles are kept for 7 days for a
    # manual check on a real desktop.
    pr-smoke:
        name: Runtime smoke (${{ matrix.target }})
        if: github.event_name == 'pull_request'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                      bundles: deb,appimage
                    - platform: windows-latest
                      target: x86_64-pc-windows-msvc
                      bundles: nsis,msi
                    - platform: macos-latest
                      target: aarch64-apple-darwin
                      bundles: app
        runs-on: ${{ matrix.platform }}
        timeout-minutes: 60
        permissions:
            contents: read
        concurrency:
            group: desktop-smoke-${{ github.event.pull_request.number }}-${{ matrix.target }}
            cancel-in-progress: true

        steps:
            - name: Harden runner
              uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}

            - name: Rust cache
              uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: apps/desktop/src-tauri

            - name: Install Linux system deps
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    libgtk-3-dev \
                    libsoup-3.0-dev \
                    libjavascriptcoregtk-4.1-dev

            # The same steps as .github/actions/setup-node-ci, inline: a workspace-relative
            # `uses:` would add a zizmor self-repository finding, and actionlint 1.7.12
            # does not accept the `$/` form zizmor asks for.
            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Validate pinned Node.js
              shell: bash
              run: node ./scripts/check-node-engine.mjs --pinned

            - name: Install dependencies
              shell: bash
              run: |
                  node ./scripts/check-pnpm-lockfile.mjs
                  pnpm install --frozen-lockfile

            - name: Build unsigned bundles
              working-directory: apps/desktop
              shell: bash
              env:
                  TARGET: ${{ matrix.target }}
                  BUNDLES: ${{ matrix.bundles }}
              run: pnpm tauri build --target "$TARGET" --bundles "$BUNDLES"

            - name: Runtime smoke
              shell: bash
              env:
                  TARGET: ${{ matrix.target }}
              run: node scripts/desktop-smoke-ci.mjs --target "$TARGET" --bundle-dir "apps/desktop/src-tauri/target/$TARGET/release/bundle"

            # tar keeps the executable bits and the bundle layout a zip of the folder loses.
            - name: Archive the macOS app for a manual check
              if: always() && runner.os == 'macOS'
              shell: bash
              env:
                  TARGET: ${{ matrix.target }}
              run: |
                  set -euo pipefail
                  bundle="apps/desktop/src-tauri/target/$TARGET/release/bundle/macos"
                  app="$(find "$bundle" -maxdepth 1 -name '*.app' -print -quit)"
                  [[ -n "$app" ]] || { echo "[WARN] no .app to archive"; exit 0; }
                  mkdir -p desktop-bundles
                  tar -czf "desktop-bundles/$TARGET.app.tar.gz" -C "$bundle" "$(basename "$app")"

            - name: Upload smoke evidence and bundles
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: desktop-smoke-pr-${{ matrix.target }}
                  path: |
                      desktop-smoke/
                      apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
                      apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
                      apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
                      apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
                      desktop-bundles/
                  if-no-files-found: warn
                  retention-days: 7

    # -----------------------------------------------------------------
    # Verify desktop assets -- fail closed before any release exists:
    # every target, installer and updater bundle present, every updater
    # signature valid against the tauri.conf.json pubkey, installers on the
    # tag's version; writes latest.json and SHA256SUMS. Runs in dry-run too.
    # -----------------------------------------------------------------
    verify:
        name: Verify desktop assets
        needs: [build]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: ${{ inputs.ref || github.sha }}
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  # No dependency cache in a release workflow (cache poisoning); the
                  # manifest script needs Node only, no packages.
                  package-manager-cache: false

            - name: Validate pinned Node.js
              shell: bash
              run: node ./scripts/check-node-engine.mjs --pinned

            - name: Download desktop builds
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: desktop-*
                  path: desktop-artifacts

            - name: Check inventory and signatures, write latest.json
              env:
                  # Release Publish passes its tag; a manual qualification run
                  # uses the version on the checked-out commit.
                  TAG_INPUT: ${{ inputs.tag }}
                  REPO: ${{ github.repository }}
              shell: bash
              run: |
                  VERSION=$(jq -r '.version' package.json)
                  TAG="${TAG_INPUT:-v${VERSION}}"
                  node scripts/release/desktop-release-manifest.mjs \
                    --artifacts desktop-artifacts --out desktop-release \
                    --version "${TAG#v}" --tag "${TAG}" --repo "${REPO}"
                  cat desktop-release/latest.json
                  cat desktop-release/SHA256SUMS

            - name: Upload verified desktop assets
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: desktop-release
                  path: desktop-release/
                  if-no-files-found: error
                  retention-days: 5
