name: Fuzzing

on:
    push:
        branches: [main]
        paths:
            - 'apps/web/services/**'
            - 'apps/web/stores/**'
            - 'apps/web/constants.ts'
            - 'apps/web/types.ts'
            - 'apps/web/vite.config.ts'
            - 'apps/web/package.json'
            - 'pnpm-lock.yaml'
            - '.github/workflows/fuzzing.yml'
    pull_request:
        branches: [main]
        paths:
            - 'apps/web/services/**'
            - 'apps/web/stores/**'
            - 'apps/web/constants.ts'
            - 'apps/web/types.ts'
            - 'apps/web/vite.config.ts'
            - 'apps/web/package.json'
            - 'pnpm-lock.yaml'
            - '.github/workflows/fuzzing.yml'
    schedule:
        - cron: '17 4 * * 2'
    workflow_dispatch:

concurrency:
    group: fuzzing-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    url-service-fuzz:
        name: Property Fuzz Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Setup Node + install dependencies
              uses: ./.github/actions/setup-node-ci

            - name: Run fuzz test suite
              run: pnpm --filter @cannaguide/web run test:fuzz
