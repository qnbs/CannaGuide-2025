name: Graphify Update

# Weekly/manual graph refresh. Generated output is an artifact for human review;
# this workflow never writes directly to the repository.
on:
    schedule:
        - cron: '30 3 * * 1'
    workflow_dispatch:

concurrency:
    group: graphify-update
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    refresh-graph:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  ref: main
                  persist-credentials: false

            - name: Install checksum-verified uv
              env:
                  UV_VERSION: '0.8.10'
                  UV_SHA256: '2c4392591fe9469d006452ef22f32712f35087d87fb1764ec03e23544eb8770d'
              run: |
                  curl -LsSf "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
                    -o /tmp/uv.tar.gz
                  echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum --check --strict
                  tar -xzf /tmp/uv.tar.gz -C /tmp
                  echo "/tmp/uv-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

            - name: Setup Node + install dependencies
              uses: ./.github/actions/setup-node-ci
              with:
                  node-version: '24'

            - name: Update graph
              run: uv run --no-project --with graphifyy==0.9.36 python -m graphify update .

            # The artifact lands on main with [skip ci], so nothing downstream would
            # catch a bad graph — but ci.yml's quality job runs this same doctor on
            # every PR. Validate here, or a broken refresh turns every PR red.
            - name: Validate refreshed graph
              run: pnpm run graphify:mcp:doctor

            - name: Upload graph for review
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: graphify-refresh-${{ github.run_id }}
                  path: graphify-out/
                  retention-days: 7
