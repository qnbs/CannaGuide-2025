name: Mutation Testing

on:
    schedule:
        # Weekly on Sunday 03:00 UTC
        - cron: '0 3 * * 0'
    workflow_dispatch:

concurrency:
    group: mutation-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    TURBO_TELEMETRY_DISABLED: 1

jobs:
    stryker:
        name: Stryker Mutation Testing
        runs-on: ubuntu-latest
        timeout-minutes: 480
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Setup Node + install dependencies
              uses: ./.github/actions/setup-node-ci

            - name: Verify and fingerprint Stryker first-party dependencies
              id: mutation-dependency-fingerprint
              run: |
                  node --test scripts/mutation-cache-fingerprint.test.mjs
                  node scripts/mutation-cache-fingerprint.mjs

            - name: Restore Stryker incremental cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: reports/mutation/.stryker-incremental.json
                  # Exact-key restore only. Hash target modules and their recursive first-party
                  # imports via the generated fingerprint, plus tests, config and toolchain inputs.
                  key: stryker-incremental-${{ hashFiles('stryker.conf.json', 'package.json', '.node-version', 'pnpm-workspace.yaml', 'apps/web/package.json', 'pnpm-lock.yaml', 'apps/web/**/*.test.ts', 'apps/web/**/*.test.tsx', 'apps/web/vite.config.ts', 'apps/web/vitest.setup.ts', 'apps/web/tsconfig*.json', 'tsconfig*.json', 'scripts/mutation-cache-fingerprint.mjs', 'scripts/mutation-cache-workspace-runtime.mjs', 'scripts/mutation-cache-fingerprint.test.mjs') }}-${{ steps.mutation-dependency-fingerprint.outputs.fingerprint }}

            - name: Run Stryker
              working-directory: apps/web
              run: pnpm exec stryker run ../../stryker.conf.json

            - name: Upload mutation report
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: mutation-report-${{ github.run_id }}
                  path: reports/mutation/
                  retention-days: 14
                  if-no-files-found: ignore
