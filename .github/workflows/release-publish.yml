name: Release Publish

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to release (e.g. v1.7.0). Tag must exist or will be created.'
                required: true
                type: string
            dry-run:
                description: 'Dry-run mode (build + verify only, no publish)'
                required: false
                type: boolean
                default: false

concurrency:
    group: release-publish-${{ github.event.inputs.tag || github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_VERSION: '24'
    TURBO_TELEMETRY_DISABLED: 1

# -----------------------------------------------------------------
# Job 1: Build -- produces tarball + CycloneDX SBOM + hash digest
# -----------------------------------------------------------------
jobs:
    build:
        name: Build + SBOM
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        if: >-
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch'
        outputs:
            tag: ${{ steps.tag.outputs.name }}
            tarball-name: ${{ steps.tarball.outputs.name }}
            sha256: ${{ steps.tarball.outputs.sha256 }}
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  # Use RELEASE_PAT if available (bypasses tag rulesets),
                  # otherwise fall back to the default GITHUB_TOKEN.
                  token: ${{ secrets.RELEASE_PAT || github.token }}

            - name: Resolve tag name
              id: tag
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  INPUT_TAG: ${{ github.event.inputs.tag }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
                    TAG="${INPUT_TAG}"
                  else
                    # push event -- github.ref_name is the tag (e.g. v1.7.0)
                    TAG="${REF_NAME}"
                  fi
                  # Strip refs/tags/ prefix if present
                  TAG="${TAG#refs/tags/}"

                  # Shape is validated HERE, before "Ensure tag exists" can create
                  # anything, so a malformed workflow_dispatch input never becomes
                  # a real tag. The value check (tag <-> package.json) has to wait
                  # until the tag's commit is checked out, further down.
                  if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                    echo "[FAIL] Tag '${TAG}' is not a v-prefixed semver tag (expected e.g. v1.10.0)."
                    exit 1
                  fi

                  echo "name=${TAG}" >> "$GITHUB_OUTPUT"
                  echo "[INFO] Resolved tag: ${TAG}"

            - name: Ensure tag exists
              if: github.event_name == 'workflow_dispatch'
              env:
                  TAG: ${{ steps.tag.outputs.name }}
                  RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
              shell: bash
              run: |
                  if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
                    echo "[OK] Tag ${TAG} already exists on remote"
                    exit 0
                  fi
                  if [[ -z "${RELEASE_PAT}" ]]; then
                    echo "[FAIL] RELEASE_PAT is required to create/push tags from workflow_dispatch."
                    exit 1
                  fi

                  echo "[INFO] Tag ${TAG} does not exist on remote -- creating annotated tag"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git config user.name "github-actions[bot]"
                  git tag -a "${TAG}" -m "Release ${TAG}" HEAD

                  if git push "https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git" "refs/tags/${TAG}"; then
                    echo "[OK] Tag ${TAG} created and pushed"
                  else
                    echo ""
                    echo "[FAIL] Could not push tag ${TAG}."
                    echo "[FAIL] Repository rulesets likely block tag creation by GITHUB_TOKEN."
                    echo ""
                    echo "[FIX] Choose one of the following:"
                    echo "  1. Push the tag manually before triggering this workflow:"
                    echo "     git tag -a ${TAG} -m 'Release ${TAG}' && git push origin ${TAG}"
                    echo "  2. Add a RELEASE_PAT repository secret (classic PAT with repo scope)"
                    echo "     that has permission to bypass tag rulesets."
                    echo "  3. Add 'github-actions[bot]' to the tag ruleset bypass list:"
                    echo "     Settings > Rules > Rulesets > Tags > Bypass list"
                    exit 1
                  fi

            # -- Resolve the commit the tag actually points at ---------
            # Everything downstream must judge THAT commit, not the ref the
            # workflow happened to be dispatched from. Previously a
            # workflow_dispatch checked out the dispatch ref while naming the
            # release after an unrelated existing tag, so artifacts could be
            # published under a tag built from a different commit -- and the
            # version assertion below would have inspected the wrong tree.
            - name: Resolve release commit
              id: commit
              env:
                  TAG: ${{ steps.tag.outputs.name }}
              shell: bash
              run: |
                  git fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
                  SHA=$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null || true)
                  if [ -z "${SHA}" ]; then
                    echo "[FAIL] Tag ${TAG} does not resolve to a commit."
                    exit 1
                  fi
                  echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
                  echo "[INFO] Releasing ${TAG} -> ${SHA}"

                  if [ "$(git rev-parse HEAD)" != "${SHA}" ]; then
                    echo "[INFO] Checked-out ref differs from the tag; moving to the tag commit."
                    git checkout --force --detach "${SHA}"
                  fi

            # -------- Tag <-> version assertion --------
            # Nothing previously tied the tag to the tree it labels. Pushing
            # v9.9.9 on a 1.10.0 checkout produced a release named
            # "CannaGuide v9.9.9" containing a 1.10.0 build -- with an SBOM and a
            # provenance attestation vouching for it. This runs AFTER the tag's
            # commit is checked out, so it inspects the tree that will actually
            # ship rather than whatever ref the run started on.
            - name: Verify tag matches package.json version
              env:
                  TAG: ${{ steps.tag.outputs.name }}
              shell: bash
              run: |
                  TAG_VERSION="${TAG#v}"
                  PKG_VERSION=$(jq -r '.version' package.json)
                  WEB_VERSION=$(jq -r '.version' apps/web/package.json)

                  echo "tag=${TAG_VERSION} root=${PKG_VERSION} web=${WEB_VERSION}"

                  if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
                    echo "[FAIL] Tag ${TAG} does not match package.json version ${PKG_VERSION}."
                    echo "[FAIL] Refusing to publish a release whose name contradicts its contents."
                    exit 1
                  fi

                  # apps/web is what actually ships and what stamps dist/version.json.
                  if [[ "${WEB_VERSION}" != "${PKG_VERSION}" ]]; then
                    echo "[FAIL] apps/web/package.json (${WEB_VERSION}) disagrees with the root (${PKG_VERSION})."
                    exit 1
                  fi

                  echo "[OK] Tag, root package.json and apps/web/package.json all agree on ${PKG_VERSION}."

            # -------- Ensure Tag Exists --------
            # For workflow_dispatch the tag may not exist yet.
            # Create an annotated tag on HEAD and push it.
            # The checkout token (RELEASE_PAT or GITHUB_TOKEN) is used
            # for git push.  If repository rulesets block tag creation,
            # the step fails with a clear error message.
            # -- CI Status guard ---------------------------------------
            # Release Publish and Release Gate both fire on the same tag push and
            # run concurrently; Actions has no cross-workflow `needs:`. Both this
            # guard and the wait below key off the RESOLVED tag commit, so a
            # workflow_dispatch is verified against the commit it will actually
            # ship rather than against whatever branch it was dispatched from.
            #
            # It runs for workflow_dispatch too. "The maintainer is in control"
            # was not a safeguard -- that was precisely the path with no
            # verification at all.
            - name: Verify CI passed on the release commit
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  COMMIT_SHA: ${{ steps.commit.outputs.sha }}
              shell: bash
              run: |
                  echo "[INFO] Checking CI status for ${COMMIT_SHA}"

                  CONCLUSION=$(gh api "repos/${REPO}/commits/${COMMIT_SHA}/check-runs" \
                    --jq '[.check_runs[] | select(.name | contains("CI Status"))] | .[0].conclusion // empty')

                  if [ -z "${CONCLUSION}" ]; then
                    echo "[FAIL] No CI Status check found for ${COMMIT_SHA}."
                    echo "[FAIL] A release must be traceable to a commit that passed the merge gate."
                    echo "[FAIL] This previously warned and continued, which -- combined with the"
                    echo "[FAIL] docs-only short-circuit in ci.yml -- let a commit that never ran"
                    echo "[FAIL] security checks be published."
                    echo ""
                    echo "[FIX] Push a commit that runs CI, or re-run CI on ${COMMIT_SHA}."
                    exit 1
                  elif [ "${CONCLUSION}" != "success" ]; then
                    echo "[FAIL] CI Status check is '${CONCLUSION}' -- not success."
                    echo "[FAIL] Aborting release. Push tag only after CI is green."
                    exit 1
                  else
                    echo "[OK] CI Status check passed (${CONCLUSION})."
                  fi

            # -- Release Gate coupling ---------------------------------
            # release-gate.yml and this workflow fire on the SAME tag event, so a
            # tag whose gate FAILED still produced a published release with an
            # SBOM and a provenance attestation. Wait for it explicitly and fail
            # closed on failure, on timeout, and on it never having run.
            #
            # The budget is 20 minutes against a 45-minute job timeout. An earlier
            # revision polled for 45 minutes inside a 15-minute job, so GitHub
            # cancelled the job long before the deadline could ever be reached --
            # the wait could not have failed closed because it could not finish.
            - name: Wait for Release Gate on the release commit
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  COMMIT_SHA: ${{ steps.commit.outputs.sha }}
              shell: bash
              run: |
                  DEADLINE=$(( SECONDS + 20 * 60 ))
                  echo "[INFO] Waiting for Release Gate on ${COMMIT_SHA}"

                  while :; do
                    RUN=$(gh api \
                      "repos/${REPO}/actions/workflows/release-gate.yml/runs?head_sha=${COMMIT_SHA}&per_page=1" \
                      --jq '.workflow_runs[0] | "\(.status)|\(.conclusion // "")"' 2>/dev/null || echo "")

                    STATUS="${RUN%%|*}"
                    CONCLUSION="${RUN#*|}"

                    if [ "${STATUS}" = "completed" ]; then
                      if [ "${CONCLUSION}" = "success" ]; then
                        echo "[OK] Release Gate succeeded for ${COMMIT_SHA}."
                        exit 0
                      fi
                      echo "[FAIL] Release Gate concluded '${CONCLUSION}' for ${COMMIT_SHA}."
                      echo "[FAIL] Refusing to publish a release the gate rejected."
                      exit 1
                    fi

                    if [ "${SECONDS}" -ge "${DEADLINE}" ]; then
                      echo "[FAIL] Timed out waiting for Release Gate on ${COMMIT_SHA}."
                      echo "[FAIL] Failing closed: an unverified tag must not publish."
                      echo "[FIX] Check whether release-gate.yml ran for this tag at all."
                      exit 1
                    fi

                    echo "[INFO] Release Gate status='${STATUS:-not started}' -- waiting 30s"
                    sleep 30
                  done

            - name: Setup Node + install dependencies
              uses: ./.github/actions/setup-node-ci
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Build
              run: pnpm run build

            # The tarball below is attested and published, so a cached dist/**
            # carrying another commit's version.json would be signed off as this
            # release's content. Stamp with the TAG's commit, then assert before
            # anything is packaged.
            - name: Stamp build metadata
              env:
                  # steps.commit.outputs.sha, NOT github.sha: the release commit is
                  # the one the TAG resolves to (`git rev-parse refs/tags/<tag>^{commit}`,
                  # full 40 chars), which is deliberately not the ref the run started
                  # on -- that distinction is the whole point of "Resolve release commit".
                  BUILD_COMMIT: ${{ steps.commit.outputs.sha }}
              run: |
                  node scripts/stamp-build-metadata.mjs
                  node scripts/stamp-build-metadata.mjs --verify

            - name: Create release tarball
              id: tarball
              shell: bash
              env:
                  RELEASE_TAG: ${{ steps.tag.outputs.name }}
              run: |
                  TARBALL="cannaguide-${RELEASE_TAG}-dist.tar.gz"
                  tar -czf "${TARBALL}" -C apps/web/dist .
                  SHA256=$(sha256sum "${TARBALL}" | cut -d ' ' -f 1)
                  echo "name=${TARBALL}" >> "$GITHUB_OUTPUT"
                  echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
                  echo "[INFO] Tarball: ${TARBALL} (sha256: ${SHA256})"

            - name: Generate CycloneDX SBOM
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
              with:
                  path: .
                  format: cyclonedx-json
                  output-file: cannaguide-sbom.cyclonedx.json
                  upload-artifact: false

            - name: Upload tarball artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: release-tarball
                  path: ${{ steps.tarball.outputs.name }}
                  if-no-files-found: error
                  retention-days: 5

            - name: Upload SBOM artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: release-sbom
                  path: cannaguide-sbom.cyclonedx.json
                  if-no-files-found: error
                  retention-days: 5

    # -----------------------------------------------------------------
    # Job 2: Release -- attestations (SBOM + build provenance) + publish
    # NOTE: slsa-framework/slsa-github-generator L3 removed -- its
    #   internal Go build fails on ubuntu-24.04 runners (Apr 2026).
    #   GitHub-native actions/attest-build-provenance provides SLSA
    #   build provenance that is verifiable via `gh attestation verify`.
    # -----------------------------------------------------------------
    release:
        name: Publish Release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [build]
        if: ${{ !(github.event.inputs.dry-run == 'true') }}
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_PAT || github.token }}

            - name: Verify tag exists on remote
              env:
                  TAG: ${{ needs.build.outputs.tag }}
              shell: bash
              run: |
                  if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
                    echo "[OK] Tag ${TAG} verified on remote"
                  else
                    echo "[FAIL] Tag ${TAG} does not exist on remote."
                    echo "[FAIL] The build job should have created it."
                    echo "[FAIL] Push the tag manually:"
                    echo "  git tag -a ${TAG} -m 'Release ${TAG}' && git push origin ${TAG}"
                    exit 1
                  fi

            - name: Download tarball
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: release-tarball

            - name: Download SBOM
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: release-sbom

            - name: Generate SBOM attestation
              uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
              with:
                  subject-path: ${{ needs.build.outputs.tarball-name }}
                  sbom-path: cannaguide-sbom.cyclonedx.json

            - name: Generate build provenance attestation
              uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
              with:
                  subject-path: ${{ needs.build.outputs.tarball-name }}

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.build.outputs.tag }}
                  TARBALL: ${{ needs.build.outputs.tarball-name }}
                  SHA256: ${{ needs.build.outputs.sha256 }}
              shell: bash
              run: |
                  SBOM_SHA256=$(sha256sum cannaguide-sbom.cyclonedx.json | cut -d ' ' -f 1)

                  NOTES="## CannaGuide ${TAG}

                  **PWA Distribution** -- Build provenance + CycloneDX SBOM

                  ### Artifact Checksums
                  | File | SHA-256 |
                  |------|---------|
                  | ${TARBALL} | \`${SHA256}\` |
                  | cannaguide-sbom.cyclonedx.json | \`${SBOM_SHA256}\` |

                  ### Supply-Chain Verification

                  **Build Provenance (GitHub Attestation):**
                  \`\`\`bash
                  gh attestation verify ${TARBALL} --repo qnbs/CannaGuide-2025
                  \`\`\`

                  **SBOM:** \`cannaguide-sbom.cyclonedx.json\` (CycloneDX JSON)

                  ### Install
                  This is a Progressive Web App. Visit https://qnbs.github.io/CannaGuide-2025/
                  "

                  # Collect release assets
                  ASSETS=("${TARBALL}" "cannaguide-sbom.cyclonedx.json")
                  REPO="${{ github.repository }}"

                  # Determine prerelease flag
                  PRE_FLAG=""
                  if echo "${TAG}" | grep -qE '(alpha|beta|rc)'; then
                    PRE_FLAG="--prerelease"
                  fi

                  # Create or update release
                  # --verify-tag: never auto-create tags (tag must exist from build job)
                  # --clobber: overwrite existing assets on retry
                  if gh release view "${TAG}" --repo "${REPO}" > /dev/null 2>&1; then
                    echo "[INFO] Release ${TAG} exists -- updating notes and uploading assets"
                    gh release edit "${TAG}" --repo "${REPO}" \
                      --title "CannaGuide ${TAG}" \
                      --notes "${NOTES}" ${PRE_FLAG}
                    gh release upload "${TAG}" "${ASSETS[@]}" --repo "${REPO}" --clobber
                  else
                    echo "[INFO] Creating new release ${TAG}"
                    gh release create "${TAG}" "${ASSETS[@]}" \
                      --repo "${REPO}" \
                      --title "CannaGuide ${TAG}" \
                      --notes "${NOTES}" \
                      --verify-tag ${PRE_FLAG}
                  fi

                  echo "[OK] Release ${TAG} published with build provenance + SBOM"
