name: OSSF Scorecard

on:
    push:
        branches: [main]
    schedule:
        - cron: '19 5 * * 1'
    workflow_dispatch:

concurrency:
    group: scorecard-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    actions: read

jobs:
    analysis:
        name: Scorecard Analysis
        runs-on: ubuntu-latest
        timeout-minutes: 20
        outputs:
            results_published: ${{ steps.scorecard.outputs.results_published }}
        permissions:
            id-token: write
            contents: read
            actions: read
            security-events: write
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  egress-policy: audit

            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Run OSSF Scorecard
              id: scorecard
              uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
              with:
                  results_file: scorecard-results.sarif
                  results_format: sarif
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_results: true
                  fail_on_publish_error: true

            - name: Upload Scorecard SARIF
              if: always()
              uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
              with:
                  sarif_file: scorecard-results.sarif

    verify-publication:
        name: Verify Scorecard publication
        needs: analysis
        # Not always(): concurrency cancels superseded runs, and a cancelled run published nothing.
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        steps:
            - name: Require published Scorecard results
              env:
                  RESULTS_PUBLISHED: ${{ needs.analysis.outputs.results_published }}
              run: |
                  if [ "$RESULTS_PUBLISHED" != "true" ]; then
                      echo "::error::Scorecard results were not published."
                      exit 1
                  fi
