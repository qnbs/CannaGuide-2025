name: OSSF Scorecard

# A periodic supply-chain assessment, not a step of every merge (owner decision, 2026-11-24):
# weekly and on demand. The analysis, the publication check and the SARIF upload are the same
# on either trigger. Dispatch it on main: only the default branch can publish, so a run from
# another branch fails the publication check by design.
on:
    schedule:
        - cron: '19 5 * * 1'
    workflow_dispatch:

concurrency:
    group: scorecard-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    actions: read

jobs:
    analysis:
        name: Scorecard Analysis
        runs-on: ubuntu-latest
        timeout-minutes: 20
        outputs:
            results_published: ${{ steps.scorecard.outputs.results_published }}
            # The HTTP status of the final publish attempt, `skipped` or `error`; empty when
            # the action never reached publication (for example, its image did not pull).
            publication_status: ${{ steps.scorecard.outputs.publication_status }}
        permissions:
            id-token: write
            contents: read
            actions: read
            security-events: write
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
              with:
                  egress-policy: audit

            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Run OSSF Scorecard
              id: scorecard
              uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
              with:
                  results_file: scorecard-results.sarif
                  results_format: sarif
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_results: true
                  fail_on_publish_error: true

            # Only a written result can be uploaded; without one the analysis step has
            # already failed the job, and an upload error would only hide that cause.
            - name: Upload Scorecard SARIF
              if: always() && hashFiles('scorecard-results.sarif') != ''
              uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
              with:
                  sarif_file: scorecard-results.sarif

    verify-publication:
        name: Verify Scorecard publication
        needs: analysis
        # Not always(): concurrency cancels superseded runs, and a cancelled run published nothing.
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        steps:
            # results_published is true only after the Scorecard API accepted the results.
            # fail_on_publish_error fails the analysis only on a rejection (a 4xx other than
            # 408 or 429); this job also fails on 5xx, timeouts, rate limits, no answer, and a
            # run that never reached publication, and names which of those it was.
            - name: Require published Scorecard results
              env:
                  RESULTS_PUBLISHED: ${{ needs.analysis.outputs.results_published }}
                  PUBLICATION_STATUS: ${{ needs.analysis.outputs.publication_status }}
                  ANALYSIS_RESULT: ${{ needs.analysis.result }}
              run: |
                  status="$PUBLICATION_STATUS"
                  case "$status" in
                      skipped | error | [1-5][0-9][0-9]) ;;
                      *) status="" ;;
                  esac
                  case "$ANALYSIS_RESULT" in
                      success | failure | cancelled | skipped) analysis="$ANALYSIS_RESULT" ;;
                      *) analysis="unknown" ;;
                  esac
                  if [ "$RESULTS_PUBLISHED" = "true" ]; then
                      echo "Scorecard results were published (HTTP ${status:-unknown})."
                      exit 0
                  fi
                  case "$status" in
                      "") echo "::error::Scorecard never reached publication: the analysis job ended '$analysis' without a publication status. Its log shows whether the action image, the analysis or the action itself failed." ;;
                      skipped) echo "::error::Scorecard did not attempt to publish (publish_results is off, or the event was a pull request)." ;;
                      error) echo "::error::The Scorecard API gave no answer (a network or signing failure). Nothing was published." ;;
                      408 | 429) echo "::error::The Scorecard API asked to retry later (HTTP $status, a timeout or rate limit). Nothing was published." ;;
                      4*) echo "::error::The Scorecard API rejected the results (HTTP $status). Check the workflow restrictions." ;;
                      *) echo "::error::The Scorecard API answered HTTP $status. Nothing was published." ;;
                  esac
                  exit 1
