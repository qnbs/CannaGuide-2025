name: Snyk Security

# Scheduled repository health signal. This is not a merge gate (the merge gate
# is pnpm audit + CodeQL inside CI). A High/Critical Snyk finding fails this
# workflow. A missing SNYK_TOKEN is an explicit skip, not a clean scan.
# SARIF is not uploaded here; the Snyk GitHub App owns PR annotations.

on:
    schedule:
        - cron: '0 2 * * 1'
    workflow_dispatch:

concurrency:
    group: snyk-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    snyk:
        name: Snyk Security Scan
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Detect SNYK_TOKEN
              id: snyk-token
              run: |
                  if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
                    echo "present=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "present=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::SNYK_TOKEN not configured. Weekly Snyk scan skipped. This is not a clean result."
                  fi

            - name: Harden runner
              if: steps.snyk-token.outputs.present == 'true'
              uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
              with:
                  egress-policy: audit

            - name: Checkout
              if: steps.snyk-token.outputs.present == 'true'
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Setup Node + install dependencies
              if: steps.snyk-token.outputs.present == 'true'
              uses: ./.github/actions/setup-node-ci

            - name: Snyk Open Source scan
              id: snyk-scan
              if: steps.snyk-token.outputs.present == 'true'
              uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  args: --severity-threshold=high --all-projects

            - name: Snyk Monitor (track vulnerabilities)
              id: snyk-monitor
              if: steps.snyk-token.outputs.present == 'true' && steps.snyk-scan.outcome == 'success'
              continue-on-error: true
              uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  command: monitor
                  args: --all-projects

            - name: Record health signal
              if: always()
              run: |
                  {
                    echo "## Snyk health signal"
                    echo ""
                    if [ "${{ steps.snyk-token.outputs.present }}" != "true" ]; then
                      echo "- Result: **skipped** (SNYK_TOKEN is not configured). This is not a clean scan."
                    elif [ "${{ steps.snyk-scan.outcome }}" != "success" ]; then
                      echo "- Result: **failed**. Snyk reported a High or Critical finding, or the scanner itself failed."
                    else
                      echo "- Result: **clean** at severity threshold high."
                    fi
                    echo "- Monitor: ${{ steps.snyk-monitor.outcome || 'skipped' }}"
                  } >> "$GITHUB_STEP_SUMMARY"
                  if [ "${{ steps.snyk-token.outputs.present }}" = "true" ] && [ "${{ steps.snyk-scan.outcome }}" != "success" ]; then
                    echo "[FAIL] Snyk scan did not succeed."
                    exit 1
                  fi
