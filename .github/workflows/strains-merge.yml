name: Strain Catalog Merge Check

on:
    pull_request:
        branches: [main]
        paths:
            - 'data/strains/**'
            - 'scripts/merge-strains.mjs'
            - '.github/workflows/strains-merge.yml'
    workflow_dispatch:

concurrency:
    group: strains-merge-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_VERSION: '24'

jobs:
    merge-catalog:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Merge static strain catalog
              env:
                  STRICT_STRAIN_MERGE: '1'
              run: pnpm run strains:merge

            - name: Check for newly introduced duplicate IDs
              env:
                  BASE_REF: origin/${{ github.base_ref || 'main' }}
              run: pnpm run strains:check-new-duplicates

            - name: Upload merge report
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: strain-merge-report
                  path: artifacts/strain-merge-report.json
