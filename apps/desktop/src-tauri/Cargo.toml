[package]
name = "cannaguide-desktop"
version = "1.12.1"
description = "CannaGuide 2025 Desktop App"
authors = ["CannaGuide Team"]
edition = "2021"
license = "MIT"

[lib]
name = "cannaguide_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
# Matches @tauri-apps/plugin-global-shortcut 2.4.1. Rust and JS ship in lockstep.
tauri-plugin-global-shortcut = "2.4.1"
# 2.12.0 fixes updater signature/version validation (SNYK-JS-TAURIAPPSPLUGINUPDATER-20081664).
# 2.14.1 moves its Windows zip extraction to zip 9 (GHSA-m665-v7pm-7grj and others, #594);
# 2.14.0 still uses zip 4.
# Keep @tauri-apps/plugin-updater in apps/desktop/package.json on the same version
# (scripts/security/check-updater-policy.mjs fails otherwise).
tauri-plugin-updater = "2.14.1"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
# One instance per profile: a second launch would be a second writer on the same
# WebKit storage, which the web app's writer lock (navigator.locks) cannot see
# across processes. Linux finds the first instance over the D-Bus session bus.
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
